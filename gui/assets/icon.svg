<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- h264mosh: rows of blocks dragged to the right by motion that is not theirs.
       The build renders it at every icon size (gui/build.rs). -->
  <rect width="256" height="256" rx="56" fill="#1c1e26"/>
  <g shape-rendering="crispEdges">
    <rect x="32" y="44" width="64" height="52" fill="#ec8e3a"/>
    <rect x="96" y="44" width="64" height="52" fill="#ec8e3a" opacity="0.6"/>
    <rect x="160" y="44" width="40" height="52" fill="#ec8e3a" opacity="0.3"/>
    <rect x="32" y="102" width="96" height="52" fill="#e0409a"/>
    <rect x="128" y="102" width="56" height="52" fill="#e0409a" opacity="0.6"/>
    <rect x="184" y="102" width="40" height="52" fill="#e0409a" opacity="0.3"/>
    <rect x="32" y="160" width="44" height="52" fill="#3ac8e0"/>
    <rect x="76" y="160" width="76" height="52" fill="#3ac8e0" opacity="0.6"/>
    <rect x="152" y="160" width="32" height="52" fill="#3ac8e0" opacity="0.3"/>
  </g>
</svg>
