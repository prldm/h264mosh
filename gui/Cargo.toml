[package]
name = "h264mosh-gui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Desktop editor for h264mosh"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
eframe = "0.36.2"
fluent-bundle = "0.16.0"
h264mosh = { path = "..", features = ["serde"] }
mimalloc = "0.1.52"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unic-langid = "0.9.6"

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["eframe", "wgpu"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }

[build-dependencies]
ico = "0.6.0"
resvg = { version = "0.49.0", default-features = false }
winresource = "0.1.34"
